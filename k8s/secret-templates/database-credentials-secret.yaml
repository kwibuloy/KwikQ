# Template. Copy to k8s/database-credentials-secret.yaml (git-ignored), fill in, then:
#   kubectl apply -f k8s/database-credentials-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: kwikq-database-credentials
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/postgres"
  # Optional: PEM of the database server's root CA (e.g. the Supabase CA certificate).
  DB_SSL_CA: ""

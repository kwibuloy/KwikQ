# Template. Copy to k8s/resend-credentials-secret.yaml (git-ignored), fill in, then kubectl apply.
apiVersion: v1
kind: Secret
metadata:
  name: kwikq-resend-credentials
  labels:
    app: kwikq
type: Opaque
stringData:
  RESEND_API_KEY: "re_YOUR_KEY"
  EMAIL_FROM: "KwikQ <noreply@your-domain.com>"
  APP_URL: "https://your-frontend-domain"
